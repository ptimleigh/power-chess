name: Build Android debug APK

on:
  push:
    branches: [main, claude/sharp-lovelace-pf9zw4]
    paths:
      - "app/**"
      - "web/**"
      - "Assets/Core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Stamp the build label
        run: sed -i "s|Label = \"dev\"|Label = \"${GITHUB_SHA::7} $(date -u +%Y-%m-%d)\"|" web/PowerChess.Web/Game/BuildInfo.cs

      - name: Test engine
        run: dotnet test tests/PowerChess.Core.Tests

      - name: Build debug APK
        run: app/scripts/build-android.sh

      - name: Check the AdMob test id made it into the manifest
        run: grep -R "ca-app-pub-3940256099942544~3347511713" app/android/app/src/main/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: power-chess-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk power-chess-debug.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest power-chess-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android debug build (test ads)" \
            --notes "Debug build of commit $GITHUB_SHA. Uses Google's AdMob test ads and a debug signing key, so it is for testing only. Install by opening this page on your Android phone, downloading power-chess-debug.apk and allowing installs from this source."
