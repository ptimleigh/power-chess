name: Chess Fighter Android build

on:
  push:
    branches: [main, claude/sleepy-bohr-05rdnm]
    paths:
      - "chess-fighter/**"
      - ".github/workflows/chess-fighter-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighter-android
  cancel-in-progress: true

env:
  VERSION_NAME: 0.1.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-fighter/app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Stamp the build label
        run: sed -i "s|Label = \"dev\"|Label = \"${GITHUB_SHA::7} $(date -u +%Y-%m-%d)\"|" chess-fighter/web/ChessFighter.Web/Game/BuildInfo.cs

      - name: Test engine
        run: dotnet test chess-fighter/tests/ChessFighter.Core.Tests

      # Real ads and release signing only turn on when these repository secrets exist. Without them the build uses Google's
      # test ads and a debug key, so it is always safe to run.
      - name: Decode the release keystore (if one is configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FIGHTER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fighter.keystore"
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID: ${{ secrets.FIGHTER_ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.FIGHTER_ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.FIGHTER_ADMOB_REWARDED_ID }}
          KEYSTORE_PATH: ${{ runner.temp }}/fighter.keystore
          KEYSTORE_PASSWORD: ${{ secrets.FIGHTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FIGHTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIGHTER_KEY_PASSWORD }}
          RELEASE: ${{ steps.keystore.outputs.present }}
        run: chess-fighter/app/scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chess-fighter-debug-apk
          path: chess-fighter/app/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.present == '1'
        with:
          name: chess-fighter-play-store-bundle
          path: chess-fighter/app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish rolling prerelease (debug APK, test ads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp chess-fighter/app/android/app/build/outputs/apk/debug/app-debug.apk chess-fighter.apk
          gh release delete fighter-android-latest --cleanup-tag --yes || true
          gh release create fighter-android-latest chess-fighter.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Chess Fighter Android debug build (test ads)" \
            --notes "Debug build of commit $GITHUB_SHA. Uses Google's AdMob test ads and a debug signing key, so it is for testing only. Open this page on your Android phone, download chess-fighter.apk and allow installs from this source."
