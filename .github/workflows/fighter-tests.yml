name: Chess Fighter tests

on:
  push:
    paths: ['chess-fighter/**', '.github/workflows/fighter-tests.yml']
  pull_request:
    paths: ['chess-fighter/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test chess-fighter/tests/ChessFighter.Core.Tests
      - run: dotnet build chess-fighter/web/ChessFighter.Web -c Release
