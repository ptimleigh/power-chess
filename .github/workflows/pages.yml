name: Deploy web prototype to GitHub Pages

on:
  push:
    branches: [main, claude/sharp-lovelace-pf9zw4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project Pages are served from /<repo-name>/, so the Blazor base href must match.
  BASE_HREF: /power-chess/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stamp the build label
        run: sed -i "s|Label = \"dev\"|Label = \"${GITHUB_SHA::7} $(date -u +%Y-%m-%d)\"|" web/PowerChess.Web/Game/BuildInfo.cs

      - name: Test engine
        run: dotnet test tests/PowerChess.Core.Tests

      - name: Publish web prototype
        run: dotnet publish web/PowerChess.Web -c Release -o out

      - name: Prepare for Pages
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_HREF}\" />|" out/wwwroot/index.html
          grep -q "<base href=\"${BASE_HREF}\" />" out/wwwroot/index.html
          touch out/wwwroot/.nojekyll
          cp out/wwwroot/index.html out/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
